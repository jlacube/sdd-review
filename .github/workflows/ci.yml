name: ci
on:
  push:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SDD_RUN_MACOS_OBSERVER: '1'
      SDD_FSEVENTS_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/generate-types.mjs
      - run: npm test -- test/integration/evidence/observer test/unit/evidence/observer
