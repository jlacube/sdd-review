name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15-intel, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: python -m pip install ruff==0.15.2
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run acceptance -- --scenarios-file test/acceptance/ci-scenarios.txt
      - run: npm run licence-check
      - run: npm run audit
      - run: npm run secret-scan
  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, browser: chrome }
          - { os: ubuntu-24.04, browser: firefox }
          - { os: windows-2025, browser: edge }
    runs-on: ${{ matrix.os }}
    env:
      SDD_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - if: matrix.browser == 'firefox'
        run: npx playwright install --with-deps firefox
      - run: npm test -- test/browser
      - run: npm run build
      - run: npm run acceptance:browser -- --scenario C001-TS-901 --scenario C001-TS-902 --scenario C001-TS-903 --scenario C001-TS-913
