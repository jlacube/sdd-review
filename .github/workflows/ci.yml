name: ci
on:
  push:
  pull_request:
  # Nightly suite (C001-T-104): hosted runners and the Windows 11 self-hosted runner.
  schedule:
    - cron: '0 2 * * *'
  # Closing-commit suite: started by hand on the closing commit (75-rollout.md Publish procedure).
  workflow_dispatch:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15-intel, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: python -m pip install ruff==0.15.2
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run bench -- harness-selftest
      - run: npm run bench -- validate-set
      - run: npm run acceptance -- --scenarios-file test/acceptance/ci-scenarios.txt
      - run: npm run licence-check
      - run: npm run audit
      - run: npm run secret-scan
  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, browser: chrome }
          - { os: ubuntu-24.04, browser: firefox }
          - { os: windows-2025, browser: edge }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SDD_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - if: matrix.browser == 'firefox'
        shell: bash
        timeout-minutes: 12
        # A hung apt or download step once stalled a run for hours: bound each try and retry.
        run: |
          for attempt in 1 2 3; do
            timeout 240 npx playwright install --with-deps firefox && exit 0
            echo "playwright install attempt $attempt failed or timed out"
          done
          exit 1
      - run: npm test -- test/browser
      - run: npm run build
      - run: npm run acceptance:browser -- --scenario C001-TS-901 --scenario C001-TS-902 --scenario C001-TS-903 --scenario C001-TS-913
  # Windows 11 self-hosted runner (C001-T-104, Q-ci-02). Runs only on schedule, workflow_dispatch and
  # pushes of v* tags, so code from a pull request never runs on the machine (C001-RISK-020).
  win11:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Windows, X64, win11]
    timeout-minutes: 90
    steps:
      - name: Operating system
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "$($os.Caption) $($os.Version) build $($os.BuildNumber) $($os.OSArchitecture)"
          if ($os.Caption -notmatch 'Windows 11') { throw "expected Windows 11, got $($os.Caption)" }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: python -m pip install ruff==0.15.2
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run bench -- harness-selftest
      - run: npm run bench -- validate-set
      - run: npm run acceptance -- --scenarios-file test/acceptance/ci-scenarios.txt
      - name: Browser scenarios (Edge)
        env:
          SDD_BROWSER: edge
        run: |
          npm test -- test/browser
          npm run acceptance:browser -- --scenario C001-TS-901 --scenario C001-TS-902 --scenario C001-TS-903 --scenario C001-TS-913
